<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#070b16"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4da3ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4da3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9d4e8"/>
      <stop offset="1" stop-color="#5d6a84"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="#fff">
    <circle cx="60" cy="70" r="1.6" opacity=".8"/><circle cx="140" cy="40" r="1.2" opacity=".6"/>
    <circle cx="410" cy="60" r="1.8" opacity=".9"/><circle cx="470" cy="140" r="1.2" opacity=".5"/>
    <circle cx="300" cy="30" r="1.1" opacity=".6"/><circle cx="35" cy="200" r="1.3" opacity=".5"/>
    <circle cx="480" cy="300" r="1.4" opacity=".7"/><circle cx="25" cy="330" r="1.2" opacity=".6"/>
    <circle cx="490" cy="420" r="1" opacity=".5"/><circle cx="70" cy="470" r="1.3" opacity=".6"/>
  </g>
  <text x="256" y="100" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="54" fill="#e8eefc">SCAN DEBRIS</text>
  <text x="256" y="142" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400" font-size="30" letter-spacing="8" fill="#9fb3d9">CONTRACT FIX</text>
  <!-- science ship and its scan beam -->
  <path d="M150 196 L190 186 L206 196 L190 206 Z" fill="url(#metal)"/>
  <path d="M178 202 L96 400 L300 400 Z" fill="url(#beam)"/>
  <!-- debris -->
  <g fill="url(#metal)" stroke="#2a3550" stroke-width="2">
    <path d="M118 330 L170 312 L182 340 L140 356 Z"/>
    <path d="M196 352 L246 338 L238 372 L204 378 Z"/>
    <path d="M150 380 L176 366 L188 392 L160 398 Z"/>
    <path d="M232 300 L262 292 L268 312 L240 318 Z"/>
  </g>
  <!-- the contract, sealed and kept -->
  <rect x="322" y="236" width="132" height="168" rx="8" fill="#e8eefc"/>
  <g stroke="#9fb3d9" stroke-width="6" stroke-linecap="round">
    <line x1="344" y1="268" x2="432" y2="268"/>
    <line x1="344" y1="292" x2="432" y2="292"/>
    <line x1="344" y1="316" x2="404" y2="316"/>
  </g>
  <circle cx="420" cy="380" r="40" fill="#2fb36a" stroke="#0b2a18" stroke-width="4"/>
  <path d="M400 380 L415 396 L442 366" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
